name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thorough:
    name: hypothesis nightly profile (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      HYPOTHESIS_PROFILE: nightly
    steps:
      - uses: actions/checkout@v4
      - name: Build dev image
        run: ./dev build
      - name: ruff, mypy --strict, pytest + coverage (nightly profile)
        run: ./dev ci ${{ matrix.python }}

  benchmark:
    name: benchmark acceptance (the L4 gates, 10 seeds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dev image
        run: ./dev build
      - name: benchmarks/run.py --check (no plots)
        run: >
          ./dev run bash -c 'export UV_PROJECT_ENVIRONMENT=/tmp/venv-3.13;
          uv sync --all-packages --python 3.13 --locked -q &&
          uv run --no-sync python benchmarks/run.py --check --no-plots --out /tmp/bench'
