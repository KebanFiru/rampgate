[project]
name = "rampgate-psutil"
version = "0.1.0"
description = "Host RAM/CPU probe for rampgate (psutil)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "rampgate>=0.1,<0.2",
    "psutil>=5.9",
]
keywords = ["rampgate", "psutil", "scheduler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/KebanFiru/rampgate"
Source = "https://github.com/KebanFiru/rampgate"
Changelog = "https://github.com/KebanFiru/rampgate/blob/main/packages/rampgate-psutil/CHANGELOG.md"
Issues = "https://github.com/KebanFiru/rampgate/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rampgate_psutil"]

[tool.uv.sources]
rampgate = { workspace = true }
