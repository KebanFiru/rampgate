[project]
name = "rampgate-nvml"
version = "0.1.0.dev0"
description = "NVIDIA GPU probe for rampgate (NVML), with process-to-container mapping."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "rampgate>=0.1.0.dev0,<0.2",
    "nvidia-ml-py>=12.535",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rampgate_nvml"]

[tool.uv.sources]
rampgate = { workspace = true }
