[project]
name = "rampgate"
version = "0.1.0"
description = "Observation-based admission scheduler: serialized warm-up, observed-peak reservations, OOM feedback. Pure Python, zero dependencies."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Hakan Bağıç" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["scheduler", "gpu", "admission control", "oom", "machine learning", "simulator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/KebanFiru/rampgate"
Source = "https://github.com/KebanFiru/rampgate"
Changelog = "https://github.com/KebanFiru/rampgate/blob/main/packages/rampgate/CHANGELOG.md"
Issues = "https://github.com/KebanFiru/rampgate/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rampgate"]
